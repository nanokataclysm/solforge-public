name: Feature request
description: Propose a focused change that preserves Solforge's human-gated safety boundary.
title: "[feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Prefer small, testable changes. Clearly distinguish shipped behavior from planned work,
        and identify anything that must never execute without explicit human approval.
  - type: textarea
    id: problem
    attributes:
      label: Problem or opportunity
      placeholder: Who is blocked, and what do they need?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the user-visible flow and the approval boundary.
    validations:
      required: true
  - type: dropdown
    id: lane
    attributes:
      label: Area
      options:
        - Orchestrator or frontend
        - Authentication or approval
        - Provider or model integration
        - Persistence, media, or signing
        - Mission analysis
        - MCP or agent tooling
        - Documentation or release process
        - Unsure
    validations:
      required: true
  - type: textarea
    id: out-of-scope
    attributes:
      label: Explicit non-goals
      placeholder: "For example: no automatic deployment, DNS changes, purchases, or client-side private keys"
  - type: checkboxes
    id: honesty
    attributes:
      label: Product honesty
      options:
        - label: I will not describe planned or experimental work as shipped
          required: true
        - label: I identified any external writes or consequential actions requiring human approval
          required: true
