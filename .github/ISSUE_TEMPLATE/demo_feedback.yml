name: Product feedback
description: Share feedback about the Solforge workflow, documentation, or local experience.
title: "[feedback] "
labels: ["feedback"]
body:
  - type: markdown
    attributes:
      value: |
        Describe only the behavior you directly observed. Do not include access codes,
        credentials, private links, personal data, or unredacted logs.
  - type: dropdown
    id: path
    attributes:
      label: What did you review?
      options:
        - Plan → review → preview workflow
        - Mission analysis
        - Signed package or verification flow
        - Local setup or tests
        - Documentation only
        - Other
    validations:
      required: true
  - type: dropdown
    id: result
    attributes:
      label: Overall result
      options:
        - Worked as expected
        - Worked with friction
        - Broken
        - Unclear documentation
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: What helped, what was confusing, and what would improve the experience?
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment or brief used (optional)
      placeholder: "Node 24 local run; sample pottery-studio brief"
