name: Bug report
description: Report a reproducible problem in the API, UI, tests, tooling, or documentation.
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem. Do not paste credentials, access codes, cookies,
        private keys, personal data, or unredacted infrastructure logs.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - API or health endpoint
        - Authentication or approval gate
        - Frontend or preview rendering
        - Provider or model integration
        - Persistence, media, or signing
        - Deployment or runtime configuration
        - Tests or release tooling
        - Documentation
        - MCP or agent tooling
        - Other
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe expected and observed behavior. Include redacted status codes or error messages when useful.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Start from …
        2. Submit …
        3. Observe …
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Operating system, Node.js version, browser, and hosting platform when relevant.
      placeholder: "Ubuntu / Node 24 / Firefox / local"
  - type: textarea
    id: logs
    attributes:
      label: Redacted logs or health output
      description: Remove credentials, identifiers, personal data, and private infrastructure details.
  - type: checkboxes
    id: safety
    attributes:
      label: Safety checks
      options:
        - label: I removed secrets, private keys, access codes, cookies, and personal data
          required: true
        - label: This is not a vulnerability report that should be submitted privately
          required: true
