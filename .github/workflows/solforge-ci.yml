name: Solforge CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: solforge-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: apps/orchestrator/.nvmrc
          cache: npm
          cache-dependency-path: apps/orchestrator/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14.7"

      - name: Check changed-line whitespace
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            git diff --check \
              "${{ github.event.pull_request.base.sha }}" \
              "${{ github.event.pull_request.head.sha }}"
          elif git rev-parse HEAD^ >/dev/null 2>&1; then
            git diff --check HEAD^ HEAD
          else
            git diff-tree --check --root HEAD
          fi

      - name: Install orchestrator dependencies
        working-directory: apps/orchestrator
        run: npm ci

      - name: Check JavaScript syntax
        working-directory: apps/orchestrator
        shell: bash
        run: |
          set -euo pipefail

          find . \
            -path ./node_modules -prune -o \
            -type f -name '*.mjs' -print0 |
            xargs -0 -r -n1 node --check
          node --check public/app.js

      - name: Run orchestrator tests
        working-directory: apps/orchestrator
        run: npm test

      - name: Validate role manifest
        working-directory: apps/orchestrator
        run: npm run validate-roles

      - name: Compile MCP Python modules
        run: |
          python -m py_compile \
            tools/mcp/agent_roles.py \
            tools/mcp/model_router.py \
            tools/mcp/test_mcp_retry.py

      - name: Run MCP mock retry tests
        run: python tools/mcp/test_mcp_retry.py
