name: Solforge CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: solforge-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: apps/orchestrator/.nvmrc
          cache: npm
          cache-dependency-path: apps/orchestrator/package-lock.json

      - name: Verify Node 24 deployment runtime
        shell: bash
        run: |
          set -euo pipefail
          node -e 'const major = Number(process.versions.node.split(".")[0]); if (major !== 24) { throw new Error(`Expected Node 24.x, received ${process.versions.node}`); }'

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: Check changed-line whitespace
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            git diff --check \
              "${{ github.event.pull_request.base.sha }}" \
              "${{ github.event.pull_request.head.sha }}"
          elif git rev-parse HEAD^ >/dev/null 2>&1; then
            git diff --check HEAD^ HEAD
          else
            git diff-tree --check --root HEAD
          fi

      - name: Install orchestrator dependencies
        working-directory: apps/orchestrator
        run: npm ci

      - name: Check JavaScript syntax
        working-directory: apps/orchestrator
        shell: bash
        run: |
          set -euo pipefail

          find . \
            -path ./node_modules -prune -o \
            -type f -name '*.mjs' -print0 |
            xargs -0 -r -n1 node --check
          node --check public/app.js

      - name: Run orchestrator tests
        working-directory: apps/orchestrator
        run: npm test

      - name: Validate role manifest
        working-directory: apps/orchestrator
        run: npm run validate-roles

      - name: Compile MCP Python modules
        run: |
          python -m py_compile \
            tools/mcp/agent_roles.py \
            tools/mcp/model_router.py \
            tools/mcp/test_mcp_retry.py

      - name: Run MCP mock retry tests
        run: python tools/mcp/test_mcp_retry.py
