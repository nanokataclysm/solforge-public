name: Sync certified merged-main export

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: write

concurrency:
  group: sync-certified-merged-main
  cancel-in-progress: false

jobs:
  sync:
    if: github.event.pull_request.head.ref == 'agent/sync-certified-merged-main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out public target branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: agent/sync-certified-merged-main
          fetch-depth: 0
          persist-credentials: true

      - name: Download and verify certified artifact
        shell: bash
        env:
          CERTIFICATION_URL: 'https://sdmntprwestus3.oaiusercontent.com/files/00000000-b778-81fd-90eb-4702baf8c0cb/raw?se=2026-08-01T23:48:14Z&sp=r&sv=2026-02-06&sr=b&scid=89749ab9-0d60-5c27-81fe-d3a57f888988&skoid=2d2fbb03-9efb-4ad0-a91c-1db2f5a47997&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-01T16:59:42Z&ske=2026-08-02T16:59:42Z&sks=b&skv=2026-02-06&sig=mKd%2BDhHeqAu6Q1BTieOxo9DKh6Mqntm07QakIBls5EU%3D'
          CERTIFICATION_ZIP_SHA256: efa28ddc595d7a43d59d397491326273478c542c61f295dd868d09b2731bff71
          CANDIDATE_ARCHIVE_SHA256: d68e3ae8c2316cc142a3cc000a5ab7006e897366acca49e0eed64d23a7b9bef2
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 --retry-delay 1 "$CERTIFICATION_URL" -o /tmp/certification.zip
          echo "$CERTIFICATION_ZIP_SHA256  /tmp/certification.zip" | sha256sum -c -
          unzip -q /tmp/certification.zip public-candidate.tar.gz -d /tmp/certification
          echo "$CANDIDATE_ARCHIVE_SHA256  /tmp/certification/public-candidate.tar.gz" | sha256sum -c -

      - name: Replace branch tree with certified candidate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/candidate
          tar -xzf /tmp/certification/public-candidate.tar.gz \
            --strip-components=1 \
            -C /tmp/candidate

          test "$(find /tmp/candidate -type f | wc -l)" -eq 103
          test -f /tmp/candidate/README.md
          test -f /tmp/candidate/LICENSE
          test ! -e /tmp/candidate/evidence
          test ! -e /tmp/candidate/docs/handoffs
          test ! -e /tmp/candidate/.github/workflows/sync-certified-export.yml

          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a /tmp/candidate/. .

          git config user.name "Solforge Certified Export"
          git config user.email "candidate@example.com"
          git add -A
          git diff --cached --check
          git commit -m "Sync certified merged-main public export"
          git push origin HEAD:agent/sync-certified-merged-main
